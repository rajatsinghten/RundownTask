<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RunDown - AI Chatbot</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3B82F6", 
                        "background-light": "#FAFAFA",
                        "background-dark": "#0f1423",
                        "surface-light": "#ffffff",
                        "chat-bubble-ai": "#F3F4F6",
                        "chat-bubble-user": "#FFFFFF",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    boxShadow: {
                        "soft": "0 4px 20px -2px rgba(0, 0, 0, 0.05)",
                        "nav": "0 -4px 20px rgba(0,0,0,0.03)"
                    }
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light text-slate-800 font-mono min-h-screen flex flex-col antialiased selection:bg-primary selection:text-white pb-32">
<header class="px-6 py-4 flex items-center gap-3 bg-background-light/90 backdrop-blur-sm z-10 sticky top-0 border-b border-slate-100/50">
<div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-primary shadow-sm border border-blue-100">
<span class="material-symbols-outlined text-2xl">smart_toy</span>
</div>
<div class="flex flex-col">
<h1 class="text-xl font-semibold tracking-tight text-slate-900">Chatbot</h1>
<span class="text-xs text-slate-400 font-medium tracking-wide">AI Assistant • Online</span>
</div>
<div class="ml-auto">
<button class="p-2 text-slate-400 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<main class="flex-1 flex flex-col px-4 pt-6 pb-4 overflow-y-auto no-scrollbar">
<div class="flex justify-center mb-8">
<span class="text-[10px] uppercase tracking-wider text-slate-400 bg-slate-100 px-3 py-1 rounded-full">Today</span>
</div>
<div class="flex gap-3 mb-6">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center border border-blue-200 mt-1">
<span class="material-symbols-outlined text-[18px]">smart_toy</span>
</div>
<div class="flex flex-col gap-1 max-w-[85%]">
<div class="bg-chat-bubble-ai px-4 py-3 rounded-2xl rounded-tl-none border border-slate-100 text-sm text-slate-700 leading-relaxed shadow-sm">
                Hello! I'm your RunDown assistant. How can I help you today?
            </div>
<span class="text-[10px] text-slate-400 ml-1">10:02 AM</span>
</div>
</div>
</main>
<div class="fixed bottom-24 left-0 right-0 px-4 pb-2 bg-background-light z-20">
<div class="flex overflow-x-auto gap-2 pb-3 no-scrollbar mb-1 px-1">
<button class="flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
            :add event
        </button>
<button class="flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
            :delete task
        </button>
<button class="flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
            :sync gmail
        </button>
<button class="flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
            :summary
        </button>
</div>
<div class="relative flex items-center bg-white rounded-xl shadow-soft border border-slate-200 p-1">
<input class="w-full bg-transparent border-none text-sm text-slate-800 placeholder-slate-400 focus:ring-0 px-4 py-3 font-mono rounded-xl" placeholder="Type a command or message..." type="text"/>
<button class="flex-shrink-0 p-2 mr-1 bg-primary text-white rounded-lg hover:bg-blue-600 transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">arrow_upward</span>
</button>
</div>
</div>
<nav class="fixed bottom-8 left-10 right-10 z-30 font-display">
<div class="bg-white/95 backdrop-blur-sm rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-slate-100 px-6 py-3">
<div class="flex justify-between items-center">
<a class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors" href="#">
<span class="material-symbols-outlined text-[24px] font-light">check_circle</span>
<span class="text-[10px] font-medium">To Do</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors" href="#">
<span class="material-symbols-outlined text-[24px] font-light">inbox</span>
<span class="text-[10px] font-medium">Inbox</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors" href="#">
<span class="material-symbols-outlined text-[24px] font-light">calendar_today</span>
<span class="text-[10px] font-medium">Calendar</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined text-[24px] font-medium filled">smart_toy</span>
<span class="text-[10px] font-medium">Chatbot</span>
</a>
</div>
</div>
</nav>

</body></html>
